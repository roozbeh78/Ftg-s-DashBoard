<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتاق عملیات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #f6f4ef; --surface: #ffffff; --surface-2: #eeece4; --ink: #1e2321; --ink-dim: #5b6360;
    --line: #ddd8cc; --accent: #8a5a3b; --accent-ink: #ffffff;
    --col-todo-bg:#FBD8DC; --col-todo-line:#D98C96;
    --col-doing-bg:#FFEBAE; --col-doing-line:#D9A93F;
    --col-followup-bg:#FFEBAE; --col-followup-line:#D9A93F;
    --col-done-bg:#D3EFD8; --col-done-line:#5FAE6E;
    --pending-bg:#EADCF7; --pending-line:#9B6FD9;
    --danger: #a2453a; --urgent: #a2453a; --decision: #4b7a8f;
    --radius: 10px; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --shadow: 0 1px 2px rgba(30,35,33,0.06), 0 4px 14px rgba(30,35,33,0.05);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg: #171916; --surface: #1f2220; --surface-2: #262a27; --ink: #ece9e2; --ink-dim: #a3a89f;
      --line: #35392f; --accent: #cf9a6e; --accent-ink: #171916;
      --col-todo-bg:#4a3236; --col-todo-line:#D98C96;
      --col-doing-bg:#4a3f22; --col-doing-line:#D9A93F;
      --col-followup-bg:#4a3f22; --col-followup-line:#D9A93F;
      --col-done-bg:#22392a; --col-done-line:#5FAE6E;
      --pending-bg:#3a2a4a; --pending-line:#B08AE8;
      --danger: #d16a5d; --urgent:#d16a5d; --decision:#6fa3ba;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg: #171916; --surface: #1f2220; --surface-2: #262a27; --ink: #ece9e2; --ink-dim: #a3a89f;
    --line: #35392f; --accent: #cf9a6e; --accent-ink: #171916;
    --col-todo-bg:#4a3236; --col-todo-line:#D98C96;
    --col-doing-bg:#4a3f22; --col-doing-line:#D9A93F;
    --col-followup-bg:#4a3f22; --col-followup-line:#D9A93F;
    --col-done-bg:#22392a; --col-done-line:#5FAE6E;
    --pending-bg:#3a2a4a; --pending-line:#B08AE8;
    --danger: #d16a5d; --urgent:#d16a5d; --decision:#6fa3ba;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:"Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; min-height:100vh; line-height:1.6; }
  .app{max-width:1180px;margin:0 auto;padding:20px 16px 64px;}

  header.top{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; padding-bottom:16px; border-bottom:2px solid var(--ink); }
  header.top h1{ font-size:22px; font-weight:800; margin:0; }
  header.top .sub{ color:var(--ink-dim); font-size:13px; }
  .user-box{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim); }
  .user-box .role-badge{ background:var(--surface-2); border-radius:999px; padding:2px 10px; font-size:11px; }
  .user-box button{ border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:5px 12px; border-radius:8px; font-family:inherit; font-size:12px; cursor:pointer; }

  nav.tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  nav.tabs button{ border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; border-radius:999px; font-family:inherit; font-size:13.5px; cursor:pointer; transition:background .15s, color .15s, border-color .15s; }
  nav.tabs button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  nav.tabs button.ghost{ border-style:dashed; color:var(--ink-dim); }
  nav.tabs button.admin-tab{ border-color:var(--accent); color:var(--accent); }
  nav.tabs button.admin-tab.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; }

  .board-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .board-head h2{ font-size:17px; margin:0; font-weight:700; }
  .board-head .actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  .viewtoggle{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .viewtoggle button{ border:none; background:var(--surface); color:var(--ink-dim); padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit; }
  .viewtoggle button.active{ background:var(--surface-2); color:var(--ink); font-weight:700; }

  .btn{ border:1px solid var(--ink); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; font-family:inherit; font-size:13.5px; cursor:pointer; }
  .btn.secondary{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn.danger{ background:transparent; color:var(--danger); border-color:var(--danger); }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn:disabled{opacity:.5;cursor:default;}

  .add-form{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; padding:12px; border:1px dashed var(--line); border-radius:9px; background:var(--surface-2); }
  .add-form input[type=text], .add-form input[type=date], .add-form input[type=email], .add-form input[type=password], .add-form select{
    padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-family:inherit; font-size:13.5px;
  }
  .add-form .f-title{ flex:2; min-width:170px; }
  .add-form .f-due{ min-width:140px; }
  .add-form .f-type{ min-width:150px; }
  input, textarea, select{ accent-color: var(--accent); }
  input:focus, textarea:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:820px){ .kanban{ grid-template-columns:1fr 1fr; } }
  @media (max-width:520px){ .kanban{ grid-template-columns:1fr; } }
  .col{ border-radius:9px; padding:10px; min-height:120px; border:1px solid transparent; }
  .col.col-todo{ background:var(--col-todo-bg); border-color:var(--col-todo-line); }
  .col.col-doing{ background:var(--col-doing-bg); border-color:var(--col-doing-line); }
  .col.col-followup{ background:var(--col-followup-bg); border-color:var(--col-followup-line); }
  .col.col-done{ background:var(--col-done-bg); border-color:var(--col-done-line); }
  .card.pending-ack{ background:var(--pending-bg); border-color:var(--pending-line); }
  .pending-note{ font-size:11.5px; color:var(--pending-line); font-weight:700; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .pending-note button{ border:1px solid var(--pending-line); background:var(--surface); color:var(--pending-line); border-radius:6px; padding:3px 9px; font-family:inherit; font-size:11px; cursor:pointer; }
  .col h3{ font-size:13px; margin:0 0 10px; font-weight:700; display:flex; align-items:center; gap:6px; color:var(--ink-dim); }
  .col h3 .cnt{ font-family:var(--mono); font-size:11px; opacity:.8; margin-right:auto; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; }
  .card .title{ font-size:14px; margin:0 0 6px; word-break:break-word; font-weight:600; }
  .card .meta-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
  .chip{ font-size:11px; border-radius:999px; padding:2px 9px; background:var(--surface-2); color:var(--ink-dim); font-family:var(--mono); }
  .chip.overdue{ background:var(--danger); color:#fff; font-weight:700; }
  .chip.type-normal{ background:var(--surface-2); color:var(--ink-dim); }
  .chip.type-urgent{ background:var(--urgent); color:#fff; }
  .chip.type-decision{ background:var(--decision); color:#fff; }
  .card .fields{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px; }
  .card .fields input[type=date], .card .fields select{ border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font-family:inherit; font-size:12px; padding:5px 6px; }
  .card .fields .f-due{ width:130px; }
  .card .fields .f-type{ flex:1; min-width:110px; }
  .card textarea{ width:100%; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font-family:inherit; font-size:12.5px; padding:6px 8px; resize:vertical; min-height:34px; margin-bottom:8px; }
  .card .row{ display:flex; gap:6px; align-items:center; justify-content:space-between; }
  .card select.status-sel{ flex:1; padding:5px 6px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-family:inherit; font-size:12.5px; }
  .icon-btn{ border:none; background:transparent; color:var(--ink-dim); cursor:pointer; font-size:15px; padding:2px 4px; }
  .icon-btn:hover{ color:var(--danger); }
  .empty{ color:var(--ink-dim); font-size:13px; padding:6px 2px; }

  .transfer-box{ background:var(--surface-2); border:1px solid var(--accent); border-radius:7px; padding:7px 9px; margin-bottom:7px; font-size:12px; }
  .transfer-box .t-actions{ display:flex; gap:6px; margin-top:6px; }
  .transfer-box .t-actions button{ flex:1; border:1px solid var(--ink); border-radius:6px; padding:4px 8px; font-family:inherit; font-size:11.5px; cursor:pointer; background:var(--surface); }
  .transfer-box .t-actions button.accept{ background:var(--done); color:#fff; border-color:var(--done); }
  .transfer-box .t-actions button.decline{ background:transparent; color:var(--danger); border-color:var(--danger); }

  table.list{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.list th{ text-align:right; font-weight:700; color:var(--ink-dim); font-size:12.5px; border-bottom:1px solid var(--line); padding:8px 6px; }
  table.list td{ border-bottom:1px solid var(--line); padding:8px 6px; vertical-align:top; }
  table.list td input[type=text], table.list td input[type=date], table.list td textarea, table.list td select{ width:100%; border:1px solid transparent; background:transparent; color:var(--ink); font-family:inherit; font-size:13px; padding:4px; }
  table.list td input:focus, table.list td textarea:focus, table.list td select:focus{ border-color:var(--line); background:var(--surface-2); border-radius:6px; }
  .row-overdue td.due-cell{ color:var(--danger); font-weight:700; }
  tr.pending-ack td{ background:var(--pending-bg); }

  .weekly-scroll{ overflow-x:auto; }
  table.weekly{ width:100%; border-collapse:collapse; font-size:13px; min-width:920px; }
  table.weekly th{ text-align:right; font-weight:700; color:var(--ink-dim); font-size:12px; border-bottom:2px solid var(--ink); padding:8px 8px; white-space:nowrap; }
  table.weekly td{ border-bottom:1px solid var(--line); padding:6px 8px; vertical-align:top; min-width:110px; }
  table.weekly td.datecell{ font-weight:700; white-space:nowrap; min-width:100px; font-family:var(--mono); }
  table.weekly textarea{ width:100%; border:1px solid transparent; background:transparent; color:var(--ink); font-family:inherit; font-size:12.8px; padding:4px; resize:vertical; min-height:38px; }
  table.weekly textarea:focus{ border-color:var(--line); background:var(--surface-2); border-radius:6px; }

  .hint{ color:var(--ink-dim); font-size:12.5px; margin-top:2px; }
  .banner{ background:var(--surface-2); border:1px dashed var(--line); border-radius:9px; padding:12px 14px; font-size:13px; color:var(--ink-dim); margin-bottom:16px; }

  .overlay{ position:fixed; inset:0; background:rgba(20,20,18,0.55); display:flex; align-items:center; justify-content:center; padding:14px; z-index:200; }
  .modal{ background:var(--surface); border:1px solid var(--line); border-radius:12px; max-width:700px; width:100%; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow); }
  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; padding:14px 18px; border-bottom:1px solid var(--line); }
  .modal-head .t{ font-weight:800; font-size:15.5px; }
  .modal-head .d{ font-size:11.5px; color:var(--ink-dim); margin-top:3px; font-family:var(--mono); }
  .modal-close{ border:none; background:none; font-size:17px; cursor:pointer; color:var(--ink-dim); }
  .modal-body{ flex:1; overflow-y:auto; padding:16px 18px; }
  .modal-foot{ display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--line); background:var(--surface-2); }
  .rep-board{ margin-bottom:22px; }
  .rep-owner-name{ font-weight:700; font-size:12.5px; margin:10px 0 6px; color:var(--ink-dim); }
  .rep-board-name{ font-weight:800; font-size:14px; border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:10px; }
  .rep-section{ margin-bottom:12px; }
  .rep-section-head{ display:inline-block; font-weight:700; font-size:11.5px; padding:3px 11px; border-radius:14px; margin-bottom:7px; background:var(--surface-2); color:var(--ink-dim); }
  .rep-item{ border-right:3px solid var(--line); padding:2px 11px 2px 0; margin-bottom:8px; }
  .rep-item-title{ font-size:13px; font-weight:600; line-height:1.6; word-break:break-word; }
  .rep-meta{ display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  .rep-none{ font-size:12px; color:var(--ink-dim); padding:4px 2px; }
  .weekly-snap{ background:var(--surface-2); border-radius:9px; padding:10px 12px; margin-bottom:18px; font-size:12.5px; }
  .weekly-snap b{ display:block; margin-bottom:6px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 20px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:300; }
  .toast.show{ opacity:1; }
  footer{ text-align:center; color:var(--ink-dim); font-size:12px; margin-top:24px; }
  #importFile{ display:none; }

  .login-wrap{ max-width:360px; margin:80px auto; }
  .login-panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; }
  .login-panel h2{ margin:0 0 4px; font-size:19px; }
  .login-panel p{ color:var(--ink-dim); font-size:12.5px; margin:0 0 18px; }
  .login-panel input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-family:inherit; font-size:14px; margin-bottom:10px; }
  .login-panel .err{ color:var(--danger); font-size:12.5px; margin-bottom:10px; min-height:1em; }

  .user-row{ border:1px solid var(--line); border-radius:9px; padding:12px; margin-bottom:10px; }
  .user-row .u-head{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .user-row .u-email{ font-weight:700; font-size:13.5px; }
  .user-row .u-stats{ font-size:11.5px; color:var(--ink-dim); font-family:var(--mono); }
  .board-chip-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .board-chip{ border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:12px; cursor:pointer; background:var(--surface); color:var(--ink-dim); }
  .board-chip.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <h1>اتاق عملیات</h1>
      <div class="sub">تخته‌های شرکت‌ها، بازار مشترک، و بازبینی هفتگی — همه در یک جا</div>
    </div>
    <div class="user-box" id="userBox" style="display:none;"></div>
  </header>

  <div id="conn-banner"></div>
  <div id="loginScreen"></div>

  <div id="authedArea" style="display:none;">
    <nav class="tabs" id="tabs"></nav>
    <div class="toolbar" id="toolbar">
      <button class="btn secondary" id="reportBtn">📋 گزارش</button>
      <button class="btn secondary" id="exportBtn">⬇️ دانلود پشتیبان</button>
      <button class="btn secondary" id="importBtn">⬆️ بارگذاری پشتیبان</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
    <div id="content"></div>
  </div>

  <footer>هر تغییری همین‌جا برای همه‌ی اعضا ذخیره و همگام می‌شود.</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const ADMIN_EMAILS = ["roozfarah@gmail.com"];
  const SUPABASE_URL = "https://netfxmjpkwhtsasuiebv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_bn8jPHFIpWflNtJNuz-rfw_4Ikmh-tM";

  const STATUSES = [
    {id:"todo", label:"در صف", cls:"todo"},
    {id:"followup", label:"در حال پیگیری", cls:"followup"},
    {id:"done", label:"انجام‌شده", cls:"done"}
  ];
  const TYPES = [
    {id:"normal", label:"عادی"},
    {id:"urgent", label:"فوری"},
    {id:"decision", label:"نیازمند تصمیم من"}
  ];
  const WEEKLY_FIELDS = [
    {key:"cash", label:"نقدینگی"}, {key:"inventory", label:"موجودی"}, {key:"sales", label:"فروش"},
    {key:"supply", label:"واردات/تأمین"}, {key:"risk", label:"ریسک این هفته"},
    {key:"opportunity", label:"فرصت این هفته"}, {key:"bottleneck", label:"گلوگاه این هفته"}, {key:"decision", label:"تصمیم/اقدام"}
  ];

  const sbMain = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let sbSecondary = null;
  function getSecondaryClient(){
    if (!sbSecondary){
      sbSecondary = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
      });
    }
    return sbSecondary;
  }

  let currentUser = null;       // {uid, email}
  let currentUserDoc = null;    // profile row
  let allUsers = [];            // profiles
  let dbReady = false;
  let boards = [];
  let tasksByBoard = {};
  let weeklyRows = [];
  let activeTab = null;
  let viewMode = {};
  let subUserByBoard = {};
  let subscribedBoardIds = new Set();

  const tabsEl = document.getElementById("tabs");
  const contentEl = document.getElementById("content");
  const bannerEl = document.getElementById("conn-banner");
  const toastEl = document.getElementById("toast");
  const userBoxEl = document.getElementById("userBox");
  const loginScreenEl = document.getElementById("loginScreen");
  const authedAreaEl = document.getElementById("authedArea");

  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(()=> toastEl.classList.remove("show"), 2200); }
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c => { if (c!==null && c!==undefined) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
  function isOverdue(due, status){ if (!due || status === "done") return false; return due < todayStr(); }
  function shortJalali(dateKey){ try{ return new Intl.DateTimeFormat("fa-IR-u-ca-persian", {month:"long", day:"numeric"}).format(new Date(dateKey+"T00:00:00")); }catch(e){ return dateKey; } }
  function typeLabel(id){ const t = TYPES.find(x=>x.id===id); return t ? t.label : ""; }
  function typeCls(id){ return "type-" + (id || "normal"); }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function isSuperAdmin(){ return !!(currentUser && ADMIN_EMAILS.includes(currentUser.email)); }
  function isAdmin(){ return isSuperAdmin() || !!(currentUserDoc && currentUserDoc.role === "admin"); }
  function userLabel(uid){ if (!uid) return ""; const u = allUsers.find(x=>x.id===uid); if (!u) return "—"; return u.display_name || (u.email ? u.email.split("@")[0] : "—"); }
  function normDue(v){ return v ? v : null; }

  // ---------- Auth / login screen ----------
  function renderLogin(errMsg){
    userBoxEl.style.display = "none";
    authedAreaEl.style.display = "none";
    loginScreenEl.innerHTML = "";
    const emailIn = el("input", {type:"email", placeholder:"ایمیل"});
    const passIn = el("input", {type:"password", placeholder:"رمز عبور"});

  // ---------- Boards / access scope ----------
  function myAccessibleBoards(){
    return boards.filter(b => b.market || isAdmin() || (currentUser && (b.allowed_uids||[]).includes(currentUser.uid)));
  }

  function renderTabs(){
    tabsEl.innerHTML = "";
    const mine = myAccessibleBoards();
    const marketBoard = mine.find(b => b.market);
    if (marketBoard){
      tabsEl.appendChild(el("button", { class: activeTab === marketBoard.id ? "active" : "", onclick: () => { activeTab = marketBoard.id; render(); } }, ["🔶 فضای اشتراک"]));
    }
    mine.filter(b => !b.market).forEach(b => {
      tabsEl.appendChild(el("button", { class: activeTab === b.id ? "active" : "", onclick: () => { activeTab = b.id; render(); } }, [b.name]));
    });
    if (isAdmin()){
      tabsEl.appendChild(el("button", { class: activeTab === "weekly" ? "active" : "", onclick: () => { activeTab = "weekly"; render(); } }, ["📋 بازبینی هفتگی"]));
      tabsEl.appendChild(el("button", { class: "ghost", onclick: addCompanyBoard }, ["+ افزودن شرکت"]));
      tabsEl.appendChild(el("button", { class: "admin-tab" + (activeTab==="admin"?" active":""), onclick: ()=>{ activeTab="admin"; render(); } }, ["👤 کاربران"]));

  async function addCompanyBoard(){
    const name = prompt("نام شرکت جدید:");
    if (!name || !name.trim()) return;
    const { data, error } = await sbMain.from("boards").insert({ name: name.trim(), market:false, allowed_uids: [], order_num: Date.now() }).select().single();
    if (error){ alert("ذخیره نشد: " + error.message); return; }
    activeTab = data.id;
  }
  async function renameBoard(b){
    const name = prompt("نام جدید شرکت:", b.name);
    if (!name || !name.trim()) return;
    await sbMain.from("boards").update({name: name.trim()}).eq("id", b.id);
  }
  async function archiveBoard(b){
    if (!confirm('تخته "'+b.name+'" از لیست تب‌ها حذف شود؟ (تسک‌های ثبت‌شده باقی می‌مانند)')) return;
    await sbMain.from("boards").update({archived:true}).eq("id", b.id);
    if (activeTab === b.id) activeTab = null;
  }

  // ---------- Render ----------
  function isTypingActive(){
    const a = document.activeElement;
    return !!(a && contentEl.contains(a) && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"));
  }
  function render(){
    if (!currentUser){ return; }
    if (isTypingActive()) return; // don't rebuild the DOM mid-typing, or in-progress text is lost
    renderTabs();
    contentEl.innerHTML = "";
    document.getElementById("toolbar").style.display = dbReady ? "flex" : "none";
    if (!dbReady){ contentEl.appendChild(el("div", {class:"panel"}, [el("p", {class:"hint"}, ["در حال اتصال..."])])); return; }
    if (activeTab === "admin" && isAdmin()){ contentEl.appendChild(renderAdmin()); return; }
    if (activeTab === "weekly"){
      if (!isAdmin()){ activeTab = null; }
      else { contentEl.appendChild(renderWeekly()); return; }
    }
    const board = myAccessibleBoards().find(b => b.id === activeTab);
    if (!board){
      const mine = myAccessibleBoards();
      if (mine.length){ activeTab = mine[0].id; render(); return; }
      contentEl.appendChild(el("div", {class:"panel"}, [ el("p", {class:"hint"}, ["هنوز به هیچ شرکتی دسترسی نداری. از ادمین بخواه دسترسی بدهد."]) ]));
      return;
    }
    contentEl.appendChild(renderBoard(board));
  }

  function ownerScopeFor(board){
    if (board.market) return null;
    if (!isAdmin()) return currentUser.uid;
    const members = (board.allowed_uids||[]);
    if (!members.length) return null;
    if (!subUserByBoard[board.id] || !members.includes(subUserByBoard[board.id])) subUserByBoard[board.id] = members[0];
    return subUserByBoard[board.id];
  }

  function renderBoard(board){
    const mode = viewMode[board.id] || "kanban";
    const panel = el("div", {class:"panel"});
    const headActions = [
      el("div", {class:"viewtoggle"}, [
        el("button", {class: mode==="kanban"?"active":"", onclick: ()=>{ viewMode[board.id]="kanban"; render(); }}, ["کانبان"]),
        el("button", {class: mode==="list"?"active":"", onclick: ()=>{ viewMode[board.id]="list"; render(); }}, ["لیست"])
      ])
    ];
    if (!board.market && isAdmin()){
      headActions.push(el("button", {class:"btn secondary", onclick: ()=>renameBoard(board)}, ["ویرایش نام"]));
      headActions.push(el("button", {class:"btn danger", onclick: ()=>archiveBoard(board)}, ["حذف تب"]));
    }
    panel.appendChild(el("div", {class:"board-head"}, [ el("h2", null, [board.name]), el("div", {class:"actions"}, headActions) ]));

    let ownerUid = ownerScopeFor(board);
    if (!board.market && isAdmin()){
      const members = (board.allowed_uids||[]);
      if (!members.length){
        panel.appendChild(el("p", {class:"hint"}, ["هنوز هیچ کاربری به این شرکت دسترسی ندارد — از تب «کاربران» دسترسی بده."]));
        return panel;
      }
      const subTabs = el("div", {class:"toolbar", style:"margin-bottom:14px;"});
      members.forEach(uid => {
        subTabs.appendChild(el("button", {class:"btn small "+(ownerUid===uid?"":"secondary"), onclick:()=>{ subUserByBoard[board.id]=uid; render(); }}, [userLabel(uid)]));
      });
      panel.appendChild(el("p", {class:"hint"}, ["فضای هر کاربر داخل این شرکت جدا و خصوصی است — این نمای «فضای " + userLabel(ownerUid) + "» است."]));
      panel.appendChild(subTabs);
    }

    panel.appendChild(renderAddForm(board, ownerUid));
    const all = tasksByBoard[board.id] || [];
    const scoped = board.market ? all : all.filter(t => t.owner_uid === ownerUid);
    const tasks = sortTasks(scoped);
    panel.appendChild(mode === "kanban" ? renderKanban(board, tasks) : renderList(board, tasks));
    return panel;
  }

  function sortTasks(tasks){
    return tasks.slice().sort((a,b)=>{
      if (!a.due && !b.due) return (a.created_order||0)-(b.created_order||0);
      if (!a.due) return 1;
      if (!b.due) return -1;
      return String(a.due).localeCompare(String(b.due));
    });
  }

  function renderAddForm(board, ownerUid){
    const boardId = board.id;
    const title = el("input", {type:"text", class:"f-title", placeholder:"عنوان کار جدید..."});
    const due = el("input", {type:"date", class:"f-due"}); due.value = todayStr();
    const typeSel = el("select", {class:"f-type"});
    TYPES.forEach(t => typeSel.appendChild(el("option", {value:t.id}, [t.label])));
    const addBtn = el("button", {class:"btn", onclick: ()=>{
      const v = title.value.trim();
      if (!v) return;
      const needsAck = !board.market && ownerUid && ownerUid !== currentUser.uid;
      addTask(boardId, { title:v, due:normDue(due.value), owner_uid: board.market ? null : ownerUid, type:typeSel.value||"normal", owner_confirmed: !needsAck });
      title.value=""; due.value=todayStr(); typeSel.value="normal";
      title.focus();
    }}, ["افزودن"]);
    title.addEventListener("keydown", (e)=>{ if (e.key === "Enter") addBtn.click(); });
    return el("div", {class:"add-form"}, [title, due, typeSel, addBtn]);
  }

  async function addTask(boardId, data){
    const row = Object.assign({
      board_id: boardId, status:"todo", notes:"", due:null, owner_uid:null, type:"normal", owner_confirmed:true,
      pending_transfer_to:null, pending_transfer_by:null,
      created_order: Date.now(), created_by: currentUser.uid
    }, data);
    const { error } = await sbMain.from("tasks").insert(row);
    if (error) alert("ذخیره نشد: " + error.message);
  }
  async function updateTask(boardId, taskId, data){
    if (data.due !== undefined) data = Object.assign({}, data, {due: normDue(data.due)});
    const { error } = await sbMain.from("tasks").update(data).eq("id", taskId);
    if (error) toast("ذخیره نشد: " + error.message);
  }
  async function deleteTask(boardId, taskId){ await sbMain.from("tasks").delete().eq("id", taskId); }

  function requestTransfer(board, t){
    const members = board.market ? allUsers.map(u=>u.id) : (board.allowed_uids||[]);
    const eligible = allUsers.filter(u => members.includes(u.id) && u.id !== t.owner_uid);
    if (!eligible.length){ toast("کاربر دیگری با دسترسی به این شرکت وجود ندارد"); return; }
    const names = eligible.map((u,i)=> (i+1)+") "+(u.display_name||u.email)).join("\n");
    const pick = prompt("انتقال به کدام کاربر؟ عدد را وارد کن:\n"+names);
    const idx = parseInt(pick,10)-1;
    if (isNaN(idx) || !eligible[idx]) return;
    updateTask(board.id, t.id, {pending_transfer_to: eligible[idx].id, pending_transfer_by: currentUser.uid});
    toast("درخواست انتقال ارسال شد");
  }
  function acceptTransfer(boardId, t){ updateTask(boardId, t.id, {owner_uid: t.pending_transfer_to, pending_transfer_to:null, pending_transfer_by:null}); }
  function declineTransfer(boardId, t){ updateTask(boardId, t.id, {pending_transfer_to:null, pending_transfer_by:null}); }

  function renderTransferBox(boardId, t){
    if (!t.pending_transfer_to) return null;
    const isTarget = t.pending_transfer_to === currentUser.uid;
    const box = el("div", {class:"transfer-box"}, [
      "🔁 در انتظار تأیید " + userLabel(t.pending_transfer_to) + " (از طرف " + userLabel(t.pending_transfer_by) + ")"
    ]);
    if (isTarget){
      box.appendChild(el("div", {class:"t-actions"}, [
        el("button", {class:"accept", onclick:()=>acceptTransfer(boardId,t)}, ["قبول"]),
        el("button", {class:"decline", onclick:()=>declineTransfer(boardId,t)}, ["رد"])
      ]));
    }
    return box;
  }

  function renderKanban(board, tasks){
    const wrap = el("div", {class:"kanban"});
    STATUSES.forEach(st => {
      const col = el("div", {class:"col col-"+st.cls});
      const items = tasks.filter(t => (t.status||"todo") === st.id);
      col.appendChild(el("h3", null, [st.label, el("span",{class:"cnt"},[String(items.length)])]));
      if (!items.length) col.appendChild(el("div", {class:"empty"}, ["—"]));
      items.forEach(t => col.appendChild(renderCard(board, t)));
      wrap.appendChild(col);
    });
    return wrap;
  }

  function confirmOwnership(boardId, t){ updateTask(boardId, t.id, {owner_confirmed:true}); }

  function renderCard(board, t){
    const isPending = !board.market && t.owner_confirmed === false;
    const card = el("div", {class:"card" + (isPending ? " pending-ack" : "")});
    if (isPending){
      const note = el("div", {class:"pending-note"}, ["✨ از طرف " + userLabel(t.created_by)]);
      if (t.owner_uid === currentUser.uid){
        note.appendChild(el("button", {onclick:()=>confirmOwnership(board.id, t)}, ["تأیید و شروع"]));
      }
      card.appendChild(note);
    }
    card.appendChild(el("p", {class:"title"}, [t.title]));
    const tb = renderTransferBox(board.id, t);
    if (tb) card.appendChild(tb);

    const metaRow = el("div", {class:"meta-row"});
    if (t.due) metaRow.appendChild(el("span", {class:"chip" + (isOverdue(t.due, t.status) ? " overdue" : "")}, ["⏳ " + shortJalali(t.due)]));
    if (board.market && t.owner_uid) metaRow.appendChild(el("span", {class:"chip"}, ["👤 " + userLabel(t.owner_uid)]));
    metaRow.appendChild(el("span", {class:"chip " + typeCls(t.type)}, [typeLabel(t.type || "normal")]));
    card.appendChild(metaRow);

    const fields = el("div", {class:"fields"});
    const dueInput = el("input", {type:"date", class:"f-due", onchange:(e)=> updateTask(board.id, t.id, {due:e.target.value})}); dueInput.value = t.due || "";
    const typeSelect = el("select", {class:"f-type", onchange:(e)=> updateTask(board.id, t.id, {type:e.target.value})});
    TYPES.forEach(ty => { const o = el("option", {value:ty.id}, [ty.label]); if ((t.type||"normal")===ty.id) o.setAttribute("selected","selected"); typeSelect.appendChild(o); });
    fields.appendChild(dueInput); fields.appendChild(typeSelect);
    card.appendChild(fields);

    const notes = el("textarea", {placeholder:"یادداشت..."}); notes.value = t.notes || "";
    let notesTimer; notes.addEventListener("input", ()=>{ clearTimeout(notesTimer); notesTimer=setTimeout(()=> updateTask(board.id, t.id, {notes: notes.value}), 500); });
    card.appendChild(notes);

    const sel = el("select", {class:"status-sel", onchange:(e)=> updateTask(board.id, t.id, {status: e.target.value})});
    STATUSES.forEach(st => { const opt = el("option", {value: st.id}, [st.label]); if ((t.status||"todo") === st.id) opt.setAttribute("selected","selected"); sel.appendChild(opt); });
    const xferBtn = el("button", {class:"icon-btn", title:"ارسال به کاربر دیگر", onclick:()=>requestTransfer(board,t)}, ["🔁"]);
    const del = el("button", {class:"icon-btn", title:"حذف", onclick: ()=>{ if(confirm("این کار حذف شود؟")) deleteTask(board.id, t.id); }}, ["✕"]);
    card.appendChild(el("div", {class:"row"}, [sel, xferBtn, del]));
    return card;
  }

  function renderList(board, tasks){
    const wrap = el("div", {});
    const table = el("table", {class:"list"});
    const headerCells = [el("th", null, ["عنوان"]), el("th", null, ["سررسید"])];
    if (board.market) headerCells.push(el("th", null, ["مسئول"]));
    headerCells.push(el("th", null, ["نوع"]), el("th", null, ["وضعیت"]), el("th", null, ["یادداشت"]), el("th", null, [""]));
    table.appendChild(el("tr", null, headerCells));
    if (!tasks.length){ table.appendChild(el("tr", null, [el("td", {colspan: board.market?"7":"6", class:"empty"}, ["هنوز کاری ثبت نشده."])])); }
    tasks.forEach(t => {
      const isPending = !board.market && t.owner_confirmed === false;
      const tr = el("tr", {class: (isOverdue(t.due, t.status) ? "row-overdue" : "") + (isPending ? " pending-ack" : "")});
      const titleInput = el("input", {type:"text"}); titleInput.value = t.title || "";
      let tTimer; titleInput.addEventListener("input", ()=>{ clearTimeout(tTimer); tTimer=setTimeout(()=>updateTask(board.id,t.id,{title:titleInput.value}),500); });
      const dueInput = el("input", {type:"date", onchange:(e)=>updateTask(board.id,t.id,{due:e.target.value})}); dueInput.value = t.due || "";
      const typeSelect = el("select", {onchange:(e)=>updateTask(board.id,t.id,{type:e.target.value})});
      TYPES.forEach(ty => { const o = el("option", {value:ty.id}, [ty.label]); if ((t.type||"normal")===ty.id) o.setAttribute("selected","selected"); typeSelect.appendChild(o); });
      const sel = el("select", {onchange:(e)=> updateTask(board.id, t.id, {status: e.target.value})});
      STATUSES.forEach(st => { const opt = el("option", {value: st.id}, [st.label]); if ((t.status||"todo") === st.id) opt.setAttribute("selected","selected"); sel.appendChild(opt); });
      const notesInput = el("textarea", {rows:"1"}); notesInput.value = t.notes || "";
      let nTimer; notesInput.addEventListener("input", ()=>{ clearTimeout(nTimer); nTimer=setTimeout(()=>updateTask(board.id,t.id,{notes:notesInput.value}),500); });
      const xferBtn = el("button", {class:"icon-btn", title:"ارسال به کاربر دیگر", onclick:()=>requestTransfer(board,t)}, ["🔁"]);
      const del = el("button", {class:"icon-btn", title:"حذف", onclick: ()=>{ if(confirm("این کار حذف شود؟")) deleteTask(board.id, t.id); }}, ["✕"]);
      tr.appendChild(el("td", null, [titleInput]));
      tr.appendChild(el("td", {class:"due-cell"}, [dueInput]));
      if (board.market) tr.appendChild(el("td", null, [userLabel(t.owner_uid)]));
      tr.appendChild(el("td", null, [typeSelect]));
      tr.appendChild(el("td", null, [sel]));
      tr.appendChild(el("td", null, [notesInput]));
      tr.appendChild(el("td", null, [xferBtn, del]));
      table.appendChild(tr);
      if (isPending && t.owner_uid === currentUser.uid){
        const note = el("div", {class:"pending-note"}, ["✨ از طرف " + userLabel(t.created_by)]);
        note.appendChild(el("button", {onclick:()=>confirmOwnership(board.id, t)}, ["تأیید و شروع"]));
        table.appendChild(el("tr", null, [el("td", {colspan: board.market?"7":"6"}, [note])]));
      }
      const tb = renderTransferBox(board.id, t);
      if (tb){ table.appendChild(el("tr", null, [el("td", {colspan: board.market?"7":"6"}, [tb])])); }
    });
    wrap.appendChild(table);
    return wrap;

  async function addWeekRow(){
    const today = new Date(); const dateStr = today.toLocaleDateString("fa-IR");
    const row = { date: dateStr, date_sort: today.getTime() };
    WEEKLY_FIELDS.forEach(f => row[f.key] = "");
    const { error } = await sbMain.from("weekly").insert(row);
    if (error) alert("ذخیره نشد: " + error.message);
  }

  // ---------- Admin ----------
  function boardStatsForUser(uid){
    let done=0, open=0;
    Object.values(tasksByBoard).forEach(list=>{
      (list||[]).forEach(t=>{ if (t.owner_uid===uid){ if ((t.status||"todo")==="done") done++; else open++; } });
    });
    return {done, open};
  }
  async function toggleUserBoard(board, uid){
    const cur = new Set(board.allowed_uids||[]);
    if (cur.has(uid)) cur.delete(uid); else cur.add(uid);
    await sbMain.from("boards").update({allowed_uids: Array.from(cur)}).eq("id", board.id);
  }
  async function toggleAdminRole(u){
    if (u.role === "superadmin") return;
    if (!confirm((u.role==="admin" ? "سلب" : "اعطای") + " نقش ادمین برای " + (u.display_name||u.email) + "؟")) return;
    const { error } = await sbMain.from("profiles").update({role: u.role==="admin" ? "member" : "admin"}).eq("id", u.id);
    if (error) toast("انجام نشد: " + error.message);
  }
  async function sendPasswordReset(u){
    if (!confirm("ایمیل بازنشانی رمز برای " + u.email + " ارسال شود؟")) return;
    const { error } = await sbMain.auth.resetPasswordForEmail(u.email);
    if (error) toast("ارسال نشد: " + error.message); else toast("ایمیل بازنشانی رمز ارسال شد");
  }
  async function renameUser(u){
    const name = prompt("نام نمایشی جدید برای " + u.email + ":", u.display_name || "");
    if (name === null || !name.trim()) return;
    const { error } = await sbMain.from("profiles").update({display_name: name.trim()}).eq("id", u.id);
    if (error) toast("ذخیره نشد: " + error.message); else toast("نام نمایشی به‌روزرسانی شد");
  }
  async function createUser(email, password, displayName){
    const client2 = getSecondaryClient();
    const { data, error } = await client2.auth.signUp({ email, password });
    if (error) throw error;
    const uid = data.user.id;
    try{ await client2.auth.signOut(); }catch(e){}
    const { error: err2 } = await sbMain.from("profiles").insert({ id: uid, email, role:"member", display_name: displayName || email.split("@")[0] });
    if (err2) throw err2;
    return uid;
  }

  function renderAdmin(){
    const panel = el("div", {class:"panel"});
    panel.appendChild(el("div", {class:"board-head"}, [ el("h2", null, ["مدیریت کاربران و دسترسی‌ها"]) ]));
    const emailIn = el("input", {type:"email", class:"f-title", placeholder:"ایمیل کاربر جدید"});
    const passIn = el("input", {type:"password", class:"f-due", placeholder:"رمز عبور موقت"});
    const nameIn = el("input", {type:"text", class:"f-type", placeholder:"نام نمایشی (اختیاری)"});
    const addBtn = el("button", {class:"btn", onclick: async ()=>{
      const email = emailIn.value.trim(), pass = passIn.value;
      if (!email || pass.length < 6){ toast("ایمیل معتبر و رمز حداقل ۶ کاراکتری لازم است"); return; }
      addBtn.disabled = true;
      try{ await createUser(email, pass, nameIn.value.trim()); toast("کاربر ساخته شد"); emailIn.value=""; passIn.value=""; nameIn.value=""; }
      catch(e){ toast("ساخت کاربر ناموفق بود: " + (e && e.message || e)); }
      addBtn.disabled = false;
    }}, ["افزودن کاربر"]);
    panel.appendChild(el("div", {class:"add-form"}, [emailIn, passIn, nameIn, addBtn]));

    const companyBoards = boards.filter(b => !b.market);
    allUsers.slice().sort((a,b)=> (a.email||"").localeCompare(b.email||"")).forEach(u => {
      const stats = boardStatsForUser(u.id);
      const row = el("div", {class:"user-row"});
      const roleLabel = u.role === "superadmin" ? "سوپرادمین" : (u.role === "admin" ? "ادمین" : "کاربر");
      const headBtns = [];
      if (isSuperAdmin() && u.role !== "superadmin"){
        headBtns.push(el("button", {class:"btn small secondary", onclick: ()=>toggleAdminRole(u)}, [u.role==="admin" ? "سلب نقش ادمین" : "ارتقا به ادمین"]));
      }
      headBtns.push(el("button", {class:"btn small secondary", onclick: ()=>sendPasswordReset(u)}, ["ارسال ایمیل بازنشانی رمز"]));
      headBtns.push(el("button", {class:"btn small secondary", onclick: ()=>renameUser(u)}, ["ویرایش نام نمایشی"]));
      row.appendChild(el("div", {class:"u-head"}, [
        el("div", null, [
          el("div", {class:"u-email"}, [u.display_name || u.email, " ", el("span",{class:"role-badge"},[roleLabel])]),
          el("div", {class:"u-stats"}, ["انجام‌شده: "+stats.done+" · باز: "+stats.open])
        ]),
        el("div", {class:"actions"}, headBtns)
      ]));
      const chips = el("div", {class:"board-chip-list"});
      companyBoards.forEach(b => {
        const on = (b.allowed_uids||[]).includes(u.id);
        chips.appendChild(el("span", {class:"board-chip"+(on?" on":""), onclick: ()=>toggleUserBoard(b, u.id)}, [b.name]));
      });
      row.appendChild(chips);
      panel.appendChild(row);
    });
    if (!allUsers.length) panel.appendChild(el("p", {class:"hint"}, ["هنوز کاربری اضافه نشده."]));
    return panel;
  }

  // ---------- Report ----------
  function latestWeek(){ if (!weeklyRows.length) return null; return weeklyRows.slice().sort((a,b)=>(b.date_sort||0)-(a.date_sort||0))[0]; }
  function reportBoardsData(){
    return myAccessibleBoards().slice().sort((a,b)=>{ if (!!a.market !== !!b.market) return a.market ? 1 : -1; return (a.order_num||0)-(b.order_num||0); });
  }
  function taskChips(t, board){
    const chips = [];
    if (t.due) chips.push({text:"⏳ " + shortJalali(t.due), late:isOverdue(t.due, t.status)});
    if (board.market && t.owner_uid) chips.push({text:"👤 " + userLabel(t.owner_uid), late:false});
    chips.push({text: typeLabel(t.type||"normal"), late:false});
    return chips;
  }
  function statusGroupsHTML(items, board){
    return STATUSES.map(st => {
      const g = sortTasks(items.filter(t => (t.status||"todo") === st.id));
      if (!g.length) return "";
      const rows = g.map(t => {
        const chips = taskChips(t, board).map(c => `<span class="chip${c.late?' overdue':''}">${escapeHtml(c.text)}</span>`).join("");
        return `<div class="rep-item"><div class="rep-item-title">${escapeHtml(t.title)}</div><div class="rep-meta">${chips}</div>${t.notes?`<div class="hint">${escapeHtml(t.notes)}</div>`:""}</div>`;
      }).join("");
      return `<div class="rep-section"><div class="rep-section-head">${st.label} · ${g.length}</div>${rows}</div>`;
    }).join("");
  }
  function buildReportHTML(){
    const parts = [];
    const wk = latestWeek();
    if (wk && isAdmin()){
      const lines = WEEKLY_FIELDS.map(f => `<div><b style="font-weight:600">${f.label}:</b> ${escapeHtml(wk[f.key]||"—")}</div>`).join("");
      parts.push(`<div class="weekly-snap"><b>آخرین بازبینی هفتگی (${escapeHtml(wk.date||"")})</b>${lines}</div>`);
    }
    const bds = reportBoardsData();
    if (!bds.length) return parts.join("") + '<div class="rep-none">هنوز تخته‌ای وجود ندارد.</div>';
    bds.forEach(b => {
      const all = tasksByBoard[b.id] || [];
      let inner = `<div class="rep-board-name">${escapeHtml(b.name)}</div>`;
      if (b.market || !isAdmin()){
        inner += all.length ? statusGroupsHTML(all, b) : '<div class="rep-none">کاری ثبت نشده.</div>';
      } else {
        const members = b.allowed_uids||[];
        if (!members.length) inner += '<div class="rep-none">کاربری ندارد.</div>';
        members.forEach(uid => {
          const items = all.filter(t => t.owner_uid === uid);
          inner += `<div class="rep-owner-name">👤 ${escapeHtml(userLabel(uid))}</div>`;
          inner += items.length ? statusGroupsHTML(items, b) : '<div class="rep-none">کاری ثبت نشده.</div>';
        });
      }
      parts.push(`<div class="rep-board">${inner}</div>`);
    });
    return parts.join("");
  }
  function buildReportText(){
    const lines = [];
    lines.push("گزارش اتاق عملیات — " + new Date().toLocaleDateString("fa-IR"));
    const wk = latestWeek();
    if (wk && isAdmin()){
      lines.push(""); lines.push("▪️ آخرین بازبینی هفتگی (" + (wk.date||"") + ")");
      WEEKLY_FIELDS.forEach(f => { if (wk[f.key]) lines.push("  " + f.label + ": " + wk[f.key]); });
    }
    reportBoardsData().forEach(b => {
      lines.push(""); lines.push("▪️ " + b.name);
      const all = tasksByBoard[b.id] || [];
      const groups = (b.market || !isAdmin()) ? [{label:null, items: all}] : (b.allowed_uids||[]).map(uid => ({label: userLabel(uid), items: all.filter(t=>t.owner_uid===uid)}));
      groups.forEach(g => {
        if (g.label) lines.push("  👤 " + g.label);
        if (!g.items.length){ lines.push("  کاری ثبت نشده."); return; }
        STATUSES.forEach(st => {
          const items = sortTasks(g.items.filter(t => (t.status||"todo") === st.id));
          if (!items.length) return;
          lines.push("  " + st.label + " (" + items.length + ")");
          items.forEach(t => { const meta = taskChips(t,b).map(c=>c.text).join("، "); lines.push("  • " + t.title + (meta ? " — " + meta : "")); });
        });
      });
    });
    return lines.join("\n").trim();
  }
  function showReportModal(){
    const overlay = el("div", {class:"overlay", onclick:(e)=>{ if (e.target===overlay) overlay.remove(); }});
    const modal = el("div", {class:"modal"});
    modal.appendChild(el("div", {class:"modal-head"}, [
      el("div", null, [ el("div", {class:"t"}, ["گزارش اتاق عملیات"]), el("div", {class:"d"}, [new Date().toLocaleDateString("fa-IR")]) ]),
      el("button", {class:"modal-close", onclick:()=>overlay.remove()}, ["✕"])
    ]));
    modal.appendChild(el("div", {class:"modal-body", html: buildReportHTML()}));
    const copyBtn = el("button", {class:"btn", onclick: async ()=>{
      try{ await navigator.clipboard.writeText(buildReportText()); toast("متن گزارش کپی شد"); } catch(e){ toast("کپی خودکار کار نکرد"); }
    }}, ["کپی متن گزارش"]);
    modal.appendChild(el("div", {class:"modal-foot"}, [copyBtn]));
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

  // ---------- Backup ----------
  function exportBackup(){
    const backup = { exportedAt:new Date().toISOString(), boards: myAccessibleBoards(), tasksByBoard, weeklyRows: isAdmin()?weeklyRows:[] };
    const blob = new Blob([JSON.stringify(backup,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = el("a", {href:url, download:"ops-hub-backup-"+todayStr()+".json"});
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast("فایل پشتیبان دانلود شد");
  }
  async function importBackup(file){
    if (!isAdmin()){ toast("فقط ادمین می‌تواند پشتیبان را بارگذاری کند"); return; }
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.boards) throw new Error("bad file");
      if (!confirm("این کار داده‌های فعلی را با فایل پشتیبان جایگزین/تکمیل می‌کند. ادامه بدهم؟")) return;
      for (const b of data.boards){
        await sbMain.from("boards").upsert(b);
        const tasks = (data.tasksByBoard && data.tasksByBoard[b.id]) || [];
        for (const t of tasks){ await sbMain.from("tasks").upsert(t); }
      }
      if (Array.isArray(data.weeklyRows)){ for (const r of data.weeklyRows){ await sbMain.from("weekly").upsert(r); } }
      toast("پشتیبان بارگذاری شد ✓");
    }catch(e){ console.error(e); toast("فایل پشتیبان معتبر نبود"); }
  }

  // ---------- Realtime subscriptions ----------
  function showBanner(msg){ bannerEl.innerHTML = ""; if (msg) bannerEl.appendChild(el("div", {class:"banner"}, [msg])); }

  async function ensureMarketBoard(){
    if (!isAdmin()) return;
    const { data } = await sbMain.from("boards").select("id").eq("market", true).maybeSingle();
    if (!data){ await sbMain.from("boards").insert({ name:"فضای اشتراک", market:true, allowed_uids: [], order_num:0 }); }
  }

  async function refetchUsers(){
    const { data, error } = await sbMain.from("profiles").select("*");
    if (error) return;
    allUsers = data || [];
    currentUserDoc = allUsers.find(u => u.id === currentUser.uid) || currentUserDoc;
    renderUserBox();
    render();
  }
  function subscribeUsers(){
    refetchUsers();
    sbMain.channel("profiles-all").on("postgres_changes", {event:"*", schema:"public", table:"profiles"}, refetchUsers).subscribe();
  }

  async function refetchBoards(){
    const { data, error } = await sbMain.from("boards").select("*");
    if (error){ showBanner("اتصال به پایگاه‌داده قطع شد: " + error.message); return; }
    boards = (data||[]).filter(b => !b.archived);
    boards.forEach(b => { if (!subscribedBoardIds.has(b.id)) subscribeTasks(b.id); });
    if (activeTab === null){
      const mine = myAccessibleBoards();
      const first = mine.find(b => !b.market) || mine.find(b=>b.market);
      if (first) activeTab = first.id;
    }
    dbReady = true;
    render();
  }
  function subscribeBoards(){
    refetchBoards();
    sbMain.channel("boards-all").on("postgres_changes", {event:"*", schema:"public", table:"boards"}, refetchBoards).subscribe();
  }

  async function refetchTasks(boardId){
    const { data, error } = await sbMain.from("tasks").select("*").eq("board_id", boardId);
    if (error) return;
    tasksByBoard[boardId] = data || [];
    render();
  }
  function subscribeTasks(boardId){
    subscribedBoardIds.add(boardId);
    refetchTasks(boardId);
    sbMain.channel("tasks-"+boardId).on("postgres_changes", {event:"*", schema:"public", table:"tasks", filter:"board_id=eq."+boardId}, ()=>refetchTasks(boardId)).subscribe();
  }

  async function refetchWeekly(){
    if (!isAdmin()) return;
    const { data, error } = await sbMain.from("weekly").select("*");
    if (error) return;
    weeklyRows = data || [];
    render();
  }
  function subscribeWeekly(){
    if (!isAdmin()) return;
    refetchWeekly();
    sbMain.channel("weekly-all").on("postgres_changes", {event:"*", schema:"public", table:"weekly"}, refetchWeekly).subscribe();
  }

  function wireToolbar(){
    contentEl.addEventListener("focusout", ()=>{ setTimeout(()=>{ if (!isTypingActive()) render(); }, 60); });
    document.getElementById("reportBtn").addEventListener("click", showReportModal);
    document.getElementById("exportBtn").addEventListener("click", exportBackup);
    document.getElementById("importBtn").addEventListener("click", ()=> document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", (e)=>{
      const file = e.target.files[0]; if (file) importBackup(file); e.target.value = "";
    });
  }

  let started = false;
  async function startAfterAuth(){
    authedAreaEl.style.display = "block";
    loginScreenEl.innerHTML = "";
    showBanner(null);
    try{ await ensureProfile(); } catch(e){ showBanner("خطا در بارگذاری پروفایل کاربر: " + (e && e.message || e)); return; }
    started = true;
    subscribeUsers();
    await ensureMarketBoard().catch(()=>{});
    subscribeBoards();
    subscribeWeekly();
    startPolling();
  }

  let pollTimer = null;
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(()=>{
      refetchUsers();
      refetchBoards();
      if (isAdmin()) refetchWeekly();
      subscribedBoardIds.forEach(id => refetchTasks(id));
    }, 8000);
  }
  function stopPolling(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

  function resetState(){
    currentUser = null; currentUserDoc = null; dbReady = false; started = false;
    boards = []; tasksByBoard = {}; weeklyRows = []; allUsers = []; activeTab = null; subscribedBoardIds = new Set();
    sbMain.removeAllChannels();
    stopPolling();
  }

  async function boot(){
    wireToolbar();
    renderLogin();
    sbMain.auth.onAuthStateChange((event, session) => {
      const user = session && session.user;
      if (user){
        currentUser = { uid:user.id, email:user.email };
        if (!started) startAfterAuth();
      } else {
        resetState();
        renderLogin();
      }
    });
  }

  boot();
})();
</script>
</body>
</html>
